server:
  port: 8081

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/customer_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    # Khoảng thời gian gửi tín hiệu sống lên server (giây)
    lease-renewal-interval-in-seconds: 5
    # Thời gian server sẽ chờ trước khi xóa service nếu không nhận được heartbeat (giây)
    lease-expiration-duration-in-seconds: 10

