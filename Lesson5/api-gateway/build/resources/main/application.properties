server.port=8080
spring.application.name=api-gateway

# Cấu hình Eureka Server Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Cấu hình route cho customer-service thông qua Service Name
spring.cloud.gateway.routes[0].id=customer-service
spring.cloud.gateway.routes[0].uri=lb://customer-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/customers/**

# CÁCH 1: Thêm Response Header qua file application.properties
# Cách 1a: Áp dụng cho từng Route cụ thể
# spring.cloud.gateway.routes[0].filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System

# Cách 1b: Áp dụng mặc định cho tất cả Route (Default Filters)
# spring.cloud.gateway.default-filters[0]=AddResponseHeader=X-System-Name, Api-Gateway-System
